name: MyView Complete NexTV - Public APK Artifact
# Full original source stays in private my-hometv/nextv.
# Only the final APK and checksum are uploaded to this public workflow run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/myview-private-build.yml'
permissions:
  contents: read
concurrency:
  group: myview-private-source-public-artifact
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Manual public APK build available"
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Build MyView full NexTV with real MultiView and today improvements')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate read-only private source access
        env:
          PRIVATE_TOKEN: ${{ secrets.MYVIEW_PRIVATE_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Missing MYVIEW_PRIVATE_READ_TOKEN secret with read-only access to my-hometv/nextv"
            exit 1
          fi
      - name: Check out complete MyView application from PRIVATE branch
        uses: actions/checkout@v4
        with:
          repository: my-hometv/nextv
          ref: myview-full-app
          token: ${{ secrets.MYVIEW_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          path: myview
      - name: Verify full app and independent identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.softppj.myview"' myview/app/build.gradle.kts
          grep -Fq 'name="app_name">MyView' myview/app/src/main/res/values/strings.xml
          test -f myview/app/src/main/java/com/softppj/nextv/MainActivity.kt
          test -f myview/app/src/main/java/com/softppj/nextv/M3uParser.kt
          test -f myview/app/src/main/java/com/softppj/nextv/BootReceiver.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform, CMake and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify native engine, compile, and unit tests
        working-directory: myview
        run: gradle --no-daemon --stacktrace :app:verifySingleLibVlc :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Assemble full-featured MyView test APK
        working-directory: myview
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check package identity and prepare APK only
        shell: bash
        run: |
          set -euo pipefail
          APK="myview/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" >/tmp/myview-apk.txt
          grep -F "package: name='com.softppj.myview'" /tmp/myview-apk.txt
          grep -F "application-label:'MyView'" /tmp/myview-apk.txt
          mkdir -p output
          cp "$APK" output/MyView-Full-NexTV-Test.apk
          (cd output && sha256sum MyView-Full-NexTV-Test.apk > MyView-Full-NexTV-Test.apk.sha256)
      - name: Publish APK artifact, never the source
        uses: actions/upload-artifact@v4
        with:
          name: MyView-Full-NexTV-Public-Test-${{ github.run_number }}
          path: |
            output/MyView-Full-NexTV-Test.apk
            output/MyView-Full-NexTV-Test.apk.sha256
          if-no-files-found: error
          retention-days: 7
