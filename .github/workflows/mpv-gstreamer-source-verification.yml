name: MPV GStreamer source verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/mpv-gstreamer-source-verification.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Kotlin, native source and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # v3 requests Google's removed legacy 'tools' SDK package and fails before compilation.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # Android API 37.0 is published under the 37.0 package name.
          # AGP currently resolves the platform using the android-37 path.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      # This repository intentionally has no Gradle wrapper. Use the same
      # pinned Gradle version as the already successful MPV integration CI.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile Kotlin, NDK probes and run regression checks without creating an APK
        run: gradle --no-daemon :app:compileDebugKotlin :app:externalNativeBuildDebug :app:check
      - name: Verify native GStreamer SDK integration when provisioned
        if: ${{ env.NEXTV_GSTREAMER_SDK != '' }}
        run: gradle --no-daemon :app:verifyGstreamerNativeBridge :app:externalNativeBuildDebug
      - name: Confirm no APK was generated
        run: |
          if find app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | grep -q .; then
            echo "APK generation is not allowed in this verification workflow"
            exit 1
          fi
