# Retired: this legacy path used to assemble an APK after a specially named
# push to myview-full-app. That bypassed the explicit, reviewed manual-build gate.
# Kept as a discoverable no-op so old documentation links are not misleading.
# Actual user-approved test builds use myview-full-app.yml, workflow_dispatch only.
name: MyView Legacy Branding APK (RETIRED - NO APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-apk:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Retired. Use the explicit manual MyView full-app workflow after approval."
