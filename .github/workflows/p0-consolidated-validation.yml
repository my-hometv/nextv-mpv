name: NexTV P0 consolidated validation (no APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Source provenance, ELF relocation and release-gate regression tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Cache Robolectric SDK jars
        uses: actions/cache@v4
        with:
          path: app/build/robolectric-deps
          key: robolectric-instrumented-9-12_1-15-v1
      - name: Provision Robolectric SDK jars before all flavor unit tests
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/robolectric-deps
          base="https://repo.maven.apache.org/maven2/org/robolectric/android-all-instrumented"
          for version in \
            9-robolectric-4913185-2-i7 \
            12.1-robolectric-8229987-i7 \
            15-robolectric-12650502-i7; do
            jar="android-all-instrumented-${version}.jar"
            target="app/build/robolectric-deps/${jar}"
            if [[ -s "${target}" ]]; then
              echo "Using cached Robolectric SDK: ${version}"
              continue
            fi
            echo "Downloading Robolectric SDK: ${version}"
            curl --fail --location --retry 2 --retry-delay 2 \
              --connect-timeout 20 --max-time 180 \
              --progress-bar "${base}/${version}/${jar}" \
              --output "${target}.part"
            test -s "${target}.part"
            mv "${target}.part" "${target}"
          done
      - name: Compile every existing LibVLC flavor and run unit tests (no APK)
        run: |
          gradle --no-daemon --stacktrace \
            :app:compileVlc351DebugKotlin \
            :app:compileVlc377DebugKotlin \
            :app:compileVlc400eap29DebugKotlin \
            :app:testVlc351DebugUnitTest \
            :app:testVlc377DebugUnitTest \
            :app:testVlc400eap29DebugUnitTest
      - name: Block claims of completed native relocation without three actual artifacts
        shell: bash
        run: |
          if [ ! -f build/isolated-libvlc/provenance.json ]; then
            echo "::warning::P0 INCOMPLETE: no independently relocated LibVLC AARs and provenance supplied."
            echo "Compilation of separate LibVLC flavors does not establish single-APK coexistence."
            exit 0
          fi
          python3 tools/gate_multi_engine_release.py build/isolated-libvlc/provenance.json
