name: NexTV LibVLC version compatibility (no APK)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Compile LibVLC ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: Vlc351
            version: '3.5.1'
          - flavor: Vlc377
            version: '3.7.7'
          - flavor: Vlc400eap29
            version: '4.0.0-eap29'
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Resolve dependency and compile Kotlin (no APK)
        run: gradle --no-daemon --stacktrace :app:compile${{ matrix.flavor }}DebugKotlin
