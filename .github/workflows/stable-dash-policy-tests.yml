name: Stable DASH - Policy Unit Tests (No APK)
on:
  workflow_dispatch:
  push:
    branches:
      - stable-dash-fix
    paths:
      - 'app/src/main/java/com/softppj/nextv/DashAudioFallbackPolicy.kt'
      - 'app/src/main/java/com/softppj/nextv/DashStallDecision.kt'
      - 'app/src/test/java/com/softppj/nextv/DashAudioFallbackPolicyTest.kt'
      - 'app/src/test/java/com/softppj/nextv/DashStallDecisionTest.kt'
      - '.github/workflows/stable-dash-policy-tests.yml'
permissions:
  contents: read
jobs:
  dash-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run isolated DASH decision regression tests
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            --tests 'com.softppj.nextv.DashAudioFallbackPolicyTest' \
            --tests 'com.softppj.nextv.DashStallDecisionTest'
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-dash-policy-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
# This workflow verifies standalone policy classes in the MPV-derived test branch.
# It does NOT compile or validate the private stable Media3/LibVLC integration.
