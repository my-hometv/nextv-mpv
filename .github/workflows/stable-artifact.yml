name: NexTV Stable — Artifact APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'TV app name (blank = existing name)'
        required: false
        type: string
      apk_name:
        description: 'APK filename without .apk (blank = app name)'
        required: false
        type: string
      release_title:
        description: 'Pre-release title (blank = current default)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out development source
        uses: actions/checkout@v4
      - name: Configure custom APK identity
        shell: bash
        env:
          CUSTOM_APP_NAME: ${{ inputs.app_name }}
          CUSTOM_APK_NAME: ${{ inputs.apk_name }}
          CUSTOM_RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib, xml.etree.ElementTree as ET
          app = os.environ.get('CUSTOM_APP_NAME','').strip()
          apk = os.environ.get('CUSTOM_APK_NAME','').strip()
          title = os.environ.get('CUSTOM_RELEASE_TITLE','').strip()
          path = pathlib.Path('app/src/main/res/values/strings.xml')
          root = ET.parse(path)
          if app:
              if len(app) > 60 or any(ord(ch) < 32 for ch in app):
                  raise SystemExit('Invalid TV app name (maximum 60 printable characters)')
              name = next((e for e in root.getroot().findall('string') if e.get('name')=='app_name'),None)
              if name is None:
                  raise SystemExit('Missing app_name resource')
              name.text = app
              root.write(path, encoding='utf-8', xml_declaration=True)
          current = next((e.text for e in root.getroot().findall('string') if e.get('name')=='app_name'), '') or 'NexTV'
          stem = apk or re.sub(r'[^A-Za-z0-9._-]+','-',current).strip('._-')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}',stem):
              raise SystemExit('APK filename must use 1–80 letters, digits, dots, underscores or hyphens')
          if len(title)>120 or any(ord(ch)<32 for ch in title):
              raise SystemExit('Invalid release title')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              print('APK_STEM='+stem,file=env)
              print('CUSTOM_RELEASE_TITLE='+title,file=env)
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is missing}"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and test
        run: gradle --no-daemon :app:verifySingleLibVlc :app:assembleDebug :app:testDebugUnitTest
      - name: Name APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK_STEM}.apk"
      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_STEM }}-Artifact-${{ github.run_number }}
          path: app/build/outputs/apk/debug/${{ env.APK_STEM }}.apk
          if-no-files-found: error
          retention-days: 14
