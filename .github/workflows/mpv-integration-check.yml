name: NexTV MPV - Integration Verification (No APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/mpv-integration-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # AGP 9.1.1 requests API 37 via the android-37 SDK directory.
          # The Android SDK package is distributed as android-37.0.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify MPV integration
        run: gradle --no-daemon :app:verifyMpvRuntime :app:compileDebugKotlin :app:testDebugUnitTest :app:mergeDebugNativeLibs
      - name: Inspect packaged MPV native binaries
        shell: bash
        run: |
          set -euo pipefail
          find app/build/intermediates -type f \( -name 'libmpv.so' -o -name 'libavcodec.so' -o -name 'libavformat.so' \) -print | sort | head -80
          test -n "$(find app/build/intermediates -type f -name 'libmpv.so' -print -quit)"
          echo "Native MPV library present. Codec support and video quality still require device verification."
      - name: Ensure APK was not generated
        shell: bash
        run: |
          if find app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected APK in verification-only workflow" >&2
            exit 1
          fi
