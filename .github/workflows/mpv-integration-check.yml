name: NexTV MPV - Integration Verification (No APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify MPV app
        run: |
          gradle --no-daemon :app:verifyMpvRuntime :app:compileDebugKotlin :app:testDebugUnitTest :app:mergeDebugNativeLibs
