name: NexTV MPV - Integration Verification (No APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/*.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate all GitHub Actions workflows (no APK)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color=false -ignore 'SC2129' .github/workflows/*.yml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # AGP 9.1.1 requests API 37 via the android-37 SDK directory.
          # The Android SDK package is distributed as android-37.0.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify MPV integration
        run: gradle --no-daemon :app:verifyGstreamerPreservation :app:verifyMpvRuntime :app:compileDebugKotlin :app:testDebugUnitTest :app:mergeDebugNativeLibs
      - name: Inspect packaged MPV native binaries
        shell: bash
        run: |
          set -euo pipefail
          find app/build/intermediates -type f \( -name 'libmpv.so' -o -name 'libavcodec.so' -o -name 'libavformat.so' \) -print | sort | head -80
          test -n "$(find app/build/intermediates -type f -name 'libmpv.so' -print -quit)"
          echo "Native MPV library present. Inspecting architectures and binary identities."
          find app/build/intermediates -type f -name 'libmpv.so' -print0 | while IFS= read -r -d '' binary; do
            echo "MPV native binary: $binary"
            file "$binary"
            sha256sum "$binary"
            readelf -h "$binary" | grep -E 'Class:|Machine:' || true
          done
          mkdir -p app/build/reports/mpv-native
          find app/build/intermediates -type f -name 'libmpv.so' -print0 | while IFS= read -r -d '' binary; do
            echo "=== $binary ===" >> app/build/reports/mpv-native/abi-inventory.txt
            file "$binary" >> app/build/reports/mpv-native/abi-inventory.txt
            sha256sum "$binary" >> app/build/reports/mpv-native/abi-inventory.txt
            readelf -h "$binary" >> app/build/reports/mpv-native/abi-inventory.txt
            readelf -d "$binary" >> app/build/reports/mpv-native/abi-inventory.txt
          done
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > app/build/reports/mpv-native/runtime-dependencies.txt
          echo "MPV/FFmpeg runtime version is also exposed in TV diagnostics."
          echo "Native library presence does not prove stream support or picture quality."
      - name: Upload native audit evidence (no APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpv-native-audit
          path: app/build/reports/mpv-native/
          if-no-files-found: warn
          retention-days: 14
      - name: Ensure APK was not generated
        shell: bash
        run: |
          if find app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected APK in verification-only workflow" >&2
            exit 1
          fi
