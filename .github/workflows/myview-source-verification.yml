name: MyView Source Verification (NO APK)
on:
  push:
    branches: [main, myview-full-app, myview-cinematic-home]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/myview-source-verification.yml'
      - '.github/workflows/myview-branding-build.yml'
      - '.github/workflows/myview-full-app.yml'
      - '.github/workflows/myview-beta-test.yml'
      - 'tools/verify_myview_branding.py'
      - 'tools/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myview-source-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK for source verification
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify original artwork and source/release contracts (NO APK)
        run: |
          python3 tools/verify_myview_branding.py
          python3 tools/verify_myview_source_contract.py
      - name: Run Python security, native provenance and audit regression tests (NO APK)
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      # Isolate dependency resolution from restored GitHub Actions Gradle caches.
      # A restored cache can contain metadata for Maven artifacts whose JARs
      # were never saved, producing misleading "Could not find *.jar" failures.
      - name: Compile Kotlin and run unit tests (never assemble an APK)
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/myview-source-gradle-home
        run: gradle --no-daemon --refresh-dependencies --stacktrace :app:verifySingleLibVlc :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Run Android Lint without assembling an APK
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/myview-source-gradle-home
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - name: Verify no APK was assembled
        shell: bash
        run: |
          if find app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Source-only verification must never produce APK files."
            exit 1
          fi
      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MyView-Source-Only-Test-Reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.txt
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.html
            app/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: ignore
          retention-days: 7
