name: NexTV GStreamer - Official SDK Native Compile (No APK)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/jni/**'
      - 'app/src/main/java/com/softppj/nextv/GstreamerPlaybackView.kt'
      - 'app/build.gradle.kts'
      - '.github/workflows/gstreamer-native-compile.yml'
permissions:
  contents: read
jobs:
  native-gstreamer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: gstreamer-native-sdk-main
      cancel-in-progress: true
    env:
      GST_VERSION: '1.28.8'
      GSTREAMER_ROOT_ANDROID: ${{ github.workspace }}/.gstreamer/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Restore verified GStreamer SDK archive cache
        id: gst-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz
            ${{ runner.temp }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz.sha256sum
          key: gstreamer-android-universal-${{ env.GST_VERSION }}-sha256-v1
      - name: Download and checksum official GStreamer Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GSTREAMER_ROOT_ANDROID"
          BASE="https://gstreamer.freedesktop.org/pkg/android/$GST_VERSION"
          ARCHIVE="gstreamer-1.0-android-universal-$GST_VERSION.tar.xz"
          if [ ! -s "$RUNNER_TEMP/$ARCHIVE" ]; then
            curl --fail --location --show-error --progress-bar --connect-timeout 20 --max-time 900 --speed-time 60 --speed-limit 10240 --retry 2 --retry-delay 5 --output "$RUNNER_TEMP/$ARCHIVE" "$BASE/$ARCHIVE"
          else
            echo "Using cached GStreamer SDK archive"
          fi
          curl --fail --location --show-error --connect-timeout 20 --max-time 45 --retry 2 --output "$RUNNER_TEMP/$ARCHIVE.sha256sum" "$BASE/$ARCHIVE.sha256sum"
          echo "Downloaded SDK bytes: $(stat -c %s "$RUNNER_TEMP/$ARCHIVE")"
          (cd "$RUNNER_TEMP" && sha256sum -c "$ARCHIVE.sha256sum")
          # The official universal tarball contains four architectures. Only
          # arm64 is extracted for this first native compilation gate.
          tar -tJf "$RUNNER_TEMP/$ARCHIVE" | head -30 || true
          tar -xJf "$RUNNER_TEMP/$ARCHIVE" -C "$GSTREAMER_ROOT_ANDROID" --wildcards 'arm64/*'
          test -f "$GSTREAMER_ROOT_ANDROID/arm64/share/gst-android/ndk-build/gstreamer-1.0.mk"
      - name: Save verified GStreamer SDK archive cache
        if: steps.gst-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz
            ${{ runner.temp }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz.sha256sum
          key: gstreamer-android-universal-${{ env.GST_VERSION }}-sha256-v1
      - name: Compile GStreamer JNI against official Android SDK (arm64)
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          "$NDK/ndk-build" -C app/src/main \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_ABI=arm64-v8a \
            NDK_OUT="$GITHUB_WORKSPACE/app/build/gstreamer-obj" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/app/build/gstreamer-jniLibs" \
            V=1
          test -s app/build/gstreamer-jniLibs/arm64-v8a/libnextv_gst_player.so
          test -s app/build/gstreamer-jniLibs/arm64-v8a/libgstreamer_android.so
          # Catch missing exported JNI methods and unresolved native symbols early.
          readelf -Ws app/build/gstreamer-jniLibs/arm64-v8a/libnextv_gst_player.so | grep -q Java_com_softppj_nextv_GstreamerPlaybackView_nativeCreate
          readelf -Ws app/build/gstreamer-jniLibs/arm64-v8a/libnextv_gst_player.so | grep -q Java_com_softppj_nextv_GstreamerPlaybackView_nativePollStatus
          file app/build/gstreamer-jniLibs/arm64-v8a/*.so
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify Gradle merges compiled GStreamer libraries (no APK)
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:verifyGstreamerPreservation :app:compileDebugKotlin :app:mergeDebugNativeLibs
          find app/build/intermediates -type f -name libnextv_gst_player.so -print
          test -n "$(find app/build/intermediates -type f -name libnextv_gst_player.so -print -quit)"
          test -n "$(find app/build/intermediates -type f -name libgstreamer_android.so -print -quit)"
          if find app/build/outputs/apk -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "Verification workflow unexpectedly generated an APK" >&2
            exit 1
          fi
