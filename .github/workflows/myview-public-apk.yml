name: MyView public test APK
on:
  push:
    branches: [myview-public-build]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myview-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MyView.apk
          sha256sum MyView.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyView-public-test-${{ github.run_number }}
          path: MyView.apk
          retention-days: 14
