name: MyView public test APK
# APK packaging is deliberately manual; commits only trigger verification.
on:
  workflow_dispatch:
  # One lightweight workflow run registers the entry in Actions.
  # No APK is compiled or uploaded on push.
  push:
    branches: [main]
    paths:
      - '.github/workflows/myview-public-apk.yml'
permissions:
  contents: read
concurrency:
  group: myview-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm manual-only APK packaging
        run: echo "MyView APK build is available only by workflow_dispatch."
  build:
    # ONE-TIME, exact-commit trigger for the user-approved standalone test APK.
    # Other pushes only run the lightweight register job; workflow_dispatch remains available.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'MyView standalone public one-time test APK build')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout ONLY public standalone MyView source
        uses: actions/checkout@v4
        with:
          ref: myview-public-build
          persist-credentials: false
      - name: Ensure clean public MyView source branch
        run: |
          test "$(git branch --show-current)" = "myview-public-build"
          test -f app/src/main/java/com/softppj/myview/MainActivity.kt
          grep -Fq 'applicationId = "com.softppj.myview"' app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile and verify before packaging
        run: gradle --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest
      - name: Android Lint release gate
        run: gradle --no-daemon :app:lintDebug
      - name: Build test APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/myview-apk-badging.txt
          grep -E "^package: name='com.softppj.myview' " /tmp/myview-apk-badging.txt
          grep -F "application-label:'MyView'" /tmp/myview-apk-badging.txt
          cp app/build/outputs/apk/debug/app-debug.apk MyView-public-test.apk
          sha256sum MyView-public-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyView-public-test-${{ github.run_number }}
          path: MyView-public-test.apk
          retention-days: 14
