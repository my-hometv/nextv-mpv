name: NexTV MPV - Manual Pre-release APK
on:
  workflow_dispatch:
    inputs:
      licensing_cleared:
        description: 'Confirm MPV/FFmpeg license notices and corresponding-source obligations are satisfied'
        required: true
        type: boolean
        default: false
      apk_approved:
        description: 'Explicitly approve generating an APK in this manual run'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Enforce explicit distribution and build approval
        env:
          LICENSING_CLEARED: ${{ inputs.licensing_cleared }}
          APK_APPROVED: ${{ inputs.apk_approved }}
        run: |
          test "$LICENSING_CLEARED" = 'true' || { echo 'Native licensing clearance required' >&2; exit 1; }
          test "$APK_APPROVED" = 'true' || { echo 'Explicit APK approval required' >&2; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # AGP 9.1.1 requests API 37 via the android-37 SDK directory.
          # The Android SDK package is distributed as android-37.0.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile and test
        run: gradle --no-daemon :app:verifyGstreamerPreservation :app:verifyMpvRuntime :app:verifyMpvOnlyEntryPoints :app:testDebugUnitTest :app:assembleDebug
      - name: Verify MPV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z -1 "$APK" | grep -E 'lib/arm64-v8a/libmpv[.]so
          if unzip -Z -1 "$APK" | grep -E 'lib/[^/]+/libvlc[.]so$'; then exit 1; fi
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="nextv-mpv-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --title "NexTV MPV Test ${GITHUB_RUN_NUMBER}" --notes "Experimental Android TV APK. Validate on device. MPV GPL licensing obligations apply." --prerelease

          unzip -Z -1 "$APK" | grep -E 'lib/[^/]+/libmpv[.]so
          if unzip -Z -1 "$APK" | grep -E 'lib/[^/]+/libvlc[.]so$'; then exit 1; fi
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="nextv-mpv-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --title "NexTV MPV Test ${GITHUB_RUN_NUMBER}" --notes "Experimental Android TV APK. Validate on device. MPV GPL licensing obligations apply." --prerelease

          if unzip -Z -1 "$APK" | grep -E 'lib/[^/]+/libvlc[.]so$'; then exit 1; fi
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="nextv-mpv-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --target "$GITHUB_SHA" --title "NexTV MPV Test ${GITHUB_RUN_NUMBER}" --notes "Experimental Android TV APK. Validate on device. MPV GPL licensing obligations apply." --prerelease
