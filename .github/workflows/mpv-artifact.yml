name: NexTV MPV - Manual APK Artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
          # AGP 9.1.1 requests API 37 via the android-37 SDK directory.
          # The Android SDK package is distributed as android-37.0.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile, test and assemble
        run: gradle --no-daemon :app:verifyMpvRuntime :app:testDebugUnitTest :app:assembleDebug
      - name: Check native MPV
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z -1 "$APK" | grep -E 'lib/[^/]+/libmpv[.]so$'
          if unzip -Z -1 "$APK" | grep -E 'lib/[^/]+/libvlc[.]so$'; then exit 1; fi
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: NexTV-MPV-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
